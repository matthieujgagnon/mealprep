<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet"></helmet>
<span data-prepared-tag="{{ v }}" style="display:inline-flex;align-items:center;gap:{{ gap }};height:{{ h }};padding:{{ pad }};background:{{ bg }};color:{{ fg }};border:1.5px solid #16181F;border-radius:{{ r }};transform:rotate({{ rot }});font:800 {{ fs }}/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.005em;white-space:nowrap;box-sizing:border-box;vertical-align:middle"><span style="width:{{ cw }};height:{{ cw }};border-radius:50%;background:{{ gbg }};color:{{ gfg }};display:flex;align-items:center;justify-content:center;flex:none"><svg width="{{ gw }}" height="{{ gw }}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="{{ sw }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11l-1.6 7.5H4.1z"></path><path d="M2.5 6.5 4.6 3.6h6.8l2.1 2.9"></path><path d="M6.1 3.6c.4-2 3.4-2 3.8 0"></path></svg></span>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:60},&quot;v&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;'a'|'b'|'c'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;s&quot;,&quot;m&quot;,&quot;l&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;'s'|'m'|'l'&quot;},&quot;sticker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fr&quot;,&quot;en&quot;],&quot;default&quot;:&quot;fr&quot;,&quot;tsType&quot;:&quot;'fr'|'en'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = this.props, v = P.v || 'd', s = P.size || 'm', en = P.lang === 'en', st = P.sticker === true || P.sticker === 'true';
    const Z = { s: { h: 15, fs: 9, gw: 9, gap: 2, pl: 3, pr: 5 }, m: { h: 18, fs: 10.5, gw: 11, gap: 3, pl: 5, pr: 7 }, l: { h: 22, fs: 12, gw: 13, gap: 4, pl: 6, pr: 9 } }[s] || {};
    const V = {
      d: { bg: '#16181F', fg: '#FFFDF8', r: '999px', rot: 3 },
      b: { bg: '#FFFDF8', r: '999px', rot: -3, dot: true },
      c: { bg: '#CDBBFF', r: s === 's' ? '4px' : '5px', rot: 0 },
    }[v] || {};
    const cw = V.dot ? Z.h - 6 : Z.gw, gw = V.dot ? Math.round((Z.h - 6) * .72) : Z.gw;
    return {
      v, label: en ? 'prepared meal' : 'plat préparé',
      h: Z.h + 'px', fs: Z.fs + 'px', gap: Z.gap + 'px', pad: '0 ' + Z.pr + 'px 0 ' + (V.dot ? 2 : Z.pl) + 'px',
      bg: V.bg, fg: V.fg || '#16181F', r: V.r, rot: (st ? V.rot : 0) + 'deg',
      cw: cw + 'px', gw: gw + 'px', gbg: V.dot ? '#16181F' : 'transparent', gfg: V.dot ? '#FFFDF8' : (V.fg || '#16181F'), sw: V.dot ? 1.9 : 1.7,
    };
  }
}
</script>
</body>
</html>
