<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;background:#F4F1EA}a{color:#2323FF;text-decoration:none}a:hover{color:#16181F}</style></helmet>
<div style="min-height:100vh;background:#F4F1EA;color:#16181F;font-family:Inter,system-ui,sans-serif">
<div style="max-width:1280px;margin:0 auto;box-sizing:border-box">
<dc-import name="Riso v2 Header" active="{{ screen }}" onNavigate="{{ go }}" hint-size="100%,96px"></dc-import>
<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><dc-import name="Riso v2 Home" embedded="{{ true }}" hint-size="100%,1400px"></dc-import></sc-if>
<sc-if value="{{ isRecipes }}" hint-placeholder-val="{{ false }}"><dc-import name="Riso v2 Recipes" embedded="{{ true }}" hint-size="100%,2000px"></dc-import></sc-if>
<sc-if value="{{ isPlanner }}" hint-placeholder-val="{{ false }}"><dc-import name="Riso v2 Recipe Finder Live" embedded="{{ true }}" view="planner" hint-size="100%,1500px"></dc-import></sc-if>
<sc-if value="{{ isMakeable }}" hint-placeholder-val="{{ false }}"><dc-import name="Riso v2 Recipe Finder Live" embedded="{{ true }}" view="makeown" hint-size="100%,1500px"></dc-import></sc-if>
<sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}"><div style="padding:8px 40px 56px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box">
<h1 style="margin:0;font:800 48px/.95 'Bricolage Grotesque',sans-serif;letter-spacing:-.035em">{{ title }}</h1>
<div style="background:#FFFDF8;border:2px dashed #16181F;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:560px">
<span style="background:#FFE14D;border:2px solid #16181F;border-radius:999px;padding:2px 12px;font:800 12px 'Bricolage Grotesque',sans-serif;transform:rotate(-3deg)">v1</span>
<p style="margin:0;font-size:14.5px;line-height:1.5;color:#3F3E37">This screen is still the v1 baseline and has not been rebuilt from the app yet. Home, Recipes, Planner and Makeable are locked in as v2.</p>
<a href="{{ v1Link }}" style="font:700 14px 'Bricolage Grotesque',sans-serif">{{ v1Label }}</a>
</div></div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;1600px&quot;}}">
class Component extends DCLogic {
  state = { screen: 'home' };
  FILES = { grocery: 'Archive/v1%20Pages/Riso%20Grocery%20List.dc.html', flyers: 'Archive/v1%20Pages/Riso%20Flyers%20Menu.dc.html', inventory: 'Archive/v1%20Pages/Riso%20Inventory.dc.html' };
  NAMES = { planner: 'Planner', makeable: 'Makeable', grocery: 'Grocery', flyers: 'Flyers', inventory: 'Inventory', help: 'Help' };
  componentDidMount() { try { const s = localStorage.getItem('riso-v2-screen'); if (s) this.setState({ screen: s }); } catch (e) {} }
  renderVals() {
    const sc = this.state.screen, other = sc !== 'home' && sc !== 'recipes' && sc !== 'planner' && sc !== 'makeable';
    return {
      screen: sc, isHome: sc === 'home', isRecipes: sc === 'recipes', isPlanner: sc === 'planner', isMakeable: sc === 'makeable', isOther: other,
      title: this.NAMES[sc] || '', v1Link: this.FILES[sc] || '#', v1Label: this.FILES[sc] ? 'Open ' + this.NAMES[sc] + ' (v1)' : '',
      go: k => { try { localStorage.setItem('riso-v2-screen', k); } catch (e) {} this.setState({ screen: k }); window.scrollTo(0, 0); },
    };
  }
}
</script>
</body>
</html>
